name: Deploy web → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; cancel any in-progress run on new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @orbit-ctrl/types build && pnpm --filter @orbit-ctrl/tools build

      - name: Build frontend
        run: pnpm --filter @orbit-ctrl/web build
        env:
          # SnapDeploy API URL — set this secret in GitHub → Settings → Secrets.
          # Format: https://<your-app>.snapdeploy.dev
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # GitHub Pages serves at /<repo-name>/ — match Vite's base to avoid
          # blank 404s on direct URL loads.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
